name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci --ignore-scripts
    
    - name: Run tests
      run: npm test
    
    - name: Run build
      run: npm run build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
    
    - name: Verify build output
      run: |
        echo "Checking build output..."
        test -f dist/js/winbox.min.js && echo "✓ winbox.min.js exists"
        test -f dist/js/winbox.bundle.min.js && echo "✓ winbox.bundle.min.js exists"
        test -f dist/css/winbox.min.css && echo "✓ winbox.min.css exists"
        test -f dist/img/*.svg && echo "✓ SVG files exist"
        test -f dist/css/themes/modern.min.css && echo "✓ modern theme CSS exists"
        test -f dist/css/themes/white.min.css && echo "✓ white theme CSS exists"